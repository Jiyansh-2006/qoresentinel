services:
  - type: web
    name: qoresentinel
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: SERVE_WEB
        value: "true"
      - key: DATABASE_PATH
        value: /tmp/qoresentinel.sqlite
      - key: APP_ORIGINS
        value: https://qoresentinel-fkbp.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: QORECHAIN_EVM_RPC
        value: https://evm-testnet.qore.host
      - key: QORECHAIN_CHAIN_ID
        value: "9800"
      - key: QORECHAIN_NETWORK
        value: diana-testnet
      - key: ADMIN_INVITATION_CODE
        sync: false
      - key: MLDSA_KEY_ENCRYPTION_SECRET
        generateValue: true
