name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_PATH: ${{ github.workspace }}/data/qoresentinel-ci.sqlite
      DATABASE_URL: file:./prisma/dev.db

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @qoresentinel/shared

      - name: Build crypto package
        run: npm run build -w @qoresentinel/crypto

      - name: Test post-quantum crypto
        run: npm run test:crypto

      - name: Build API
        run: npm run build -w @qoresentinel/api

      - name: Test API
        run: npm test -w @qoresentinel/api

      - name: Build web app
        run: npm run build -w @qoresentinel/web

      - name: Test smart contracts
        run: npm run test:contracts

      - name: Validate Prisma schema
        run: npx prisma validate --schema=prisma/schema.prisma
